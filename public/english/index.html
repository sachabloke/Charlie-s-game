<style>
/* Layout: one centred column like an exercise-book page; ink-blue cover, highlighter yellow marks the active thing. */
:root {

  --mark: #ffe066;
  --good: #1f9d57;
  --good-bg: #e3f6eb;
  --bad: #d64545;
  --bad-bg: #fdeaea;

  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1a26; --paper: #172636; --ink: #e8f0f8; --muted: #9db0c3; --line: #2a3d51;
    --accent: #5b95f0; --accent-ink: #0b1622; --mark: #ffd84d; --good: #4fd18b; --good-bg: #163527;

  }
}
:root[data-theme="dark"] {
  --bg: #0f1a26; --paper: #172636; --ink: #e8f0f8; --muted: #9db0c3; --line: #2a3d51;
  --accent: #5b95f0; --accent-ink: #0b1622; --mark: #ffd84d; --good: #4fd18b; --good-bg: #163527;
  --bad: #ff7b7b; --bad-bg: #3a1c1f; --chip: #20344a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.5; }
.wrap { max-width: 680px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: grid; gap: 18px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; margin: 0; text-wrap: balance; line-height: 1.15; }
h1 { font-size: 34px; }
h2 { font-size: 24px; }
h3 { font-size: 19px; }
p { margin: 0; }
.muted { color: var(--muted); }
.hl { background: linear-gradient(transparent 55%, var(--mark) 55%); padding: 0 2px; color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; }

.btn.ghost { background: var(--chip); color: var(--ink); box-shadow: none; }
a.btn { text-decoration: none; text-align: center; display: inline-block; }
.send .actions .btn { flex: 1 1 120px; }
.btn.wide { width: 100%; }

header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.levels { display: flex; gap: 6px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.levels button { padding: 6px 12px; border-radius: 9px; font-weight: 800; font-size: 14px; color: var(--muted); }
.levels button[aria-pressed="true"] { background: var(--mark); color: #2a2300; }

.hero { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: grid; gap: 14px; }

.topic .row button { padding: 7px 14px; border-radius: 10px; font-weight: 800; font-size: 15px; background: var(--chip); }
.topic .row button.go { background: var(--accent); color: var(--accent-ink); }
.best { font-size: 13px; font-weight: 800; padding: 2px 8px; border-radius: 99px; background: var(--chip); color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
.best.good { background: var(--good-bg); color: var(--good); }
.best.weak { background: var(--bad-bg); color: var(--bad); }

.card { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: grid; gap: 14px; }
.bar { height: 10px; background: var(--chip); border-radius: 99px; overflow: hidden; }
.bar > div { height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.qmeta { display: flex; justify-content: space-between; gap: 8px; font-weight: 800; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tag { font-size: 13px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); }
.qtext { font-size: 21px; font-weight: 700; white-space: pre-line; }
.qtext.long { font-size: 18px; font-weight: 600; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choices.long { grid-template-columns: 1fr; }
.choice { text-align: left; display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--paper); font-weight: 800; font-size: 18px; line-height: 1.3; min-width: 0; }
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice .n { flex: none; width: 26px; height: 26px; border-radius: 7px; background: var(--chip); color: var(--muted); font-size: 14px; display: inline-flex; align-items: center; justify-content: center; }
.choice.right { border-color: var(--good); background: var(--good-bg); }
.choice.wrong { border-color: var(--bad); background: var(--bad-bg); }
.choice:disabled { cursor: default; }
.typed { display: flex; gap: 10px; flex-wrap: wrap; }
.typed input { flex: 1 1 200px; min-width: 0; font: inherit; font-size: 20px; font-weight: 700; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--paper); color: var(--ink); }
.feedback { border-radius: 14px; padding: 14px 16px; display: grid; gap: 6px; }
.feedback.good { background: var(--good-bg); }
.feedback.bad { background: var(--bad-bg); }
.feedback strong { font-family: var(--display); font-size: 20px; font-weight: 600; }
.feedback.good strong { color: var(--good); }
.feedback.bad strong { color: var(--bad); }
.hint { font-size: 15px; color: var(--muted); }

.lesson { display: grid; gap: 12px; }
.lesson ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.example { background: var(--chip); border-radius: 12px; padding: 10px 14px; }

.score { font-family: var(--display); font-size: 56px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.stars { font-size: 30px; letter-spacing: 4px; color: var(--mark); -webkit-text-stroke: 1px color-mix(in srgb, var(--mark) 50%, #000); }
.results { display: grid; gap: 6px; }
.results .r { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-weight: 700; }
.results .r span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.actions .btn { flex: 1 1 200px; }
.review { display: grid; gap: 10px; }
.review .item { border-left: 4px solid var(--bad); padding: 4px 0 4px 12px; font-size: 15px; }
.review .item b { display: block; white-space: pre-line; }

@media (max-width: 480px) {
  h1 { font-size: 28px; }
  .choices { grid-template-columns: 1fr; }
  .qtext { font-size: 19px; }
  .qtext.long { font-size: 16px; }
  .choice { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

const LEVELS = [
  { id: 'easy', name: 'Warm-up', min: 1, max: 2 },
  { id: 'normal', name: 'Year 5/6', min: 1, max: 3 },
  { id: 'hard', name: 'Challenge', min: 2, max: 4 },
];
const QUIZ_LEN = 20;

// ---------- saved progress (this browser only) ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem('ce-' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ce-' + k, JSON.stringify(v)); } catch (e) { /* ignore */ } },
};
let level = store.get('level', 'normal');
let stats = store.get('stats', {}); // topic id -> { right, total }

// ---------- quiz state ----------
let quiz = null;

function makeQuestion(topicIds) {
  const lv = LEVELS.find((l) => l.id === level) || LEVELS[1];
  let pool = [];
  for (const t of TOPICS) if (topicIds.includes(t.id)) for (const [lvl, fn] of t.makers) pool.push({ t, lvl, fn });
  if (topicIds.length > 1) { const inRange = pool.filter((p) => p.lvl >= lv.min && p.lvl <= lv.max); if (inRange.length) pool = inRange; }
  const prev = quiz && quiz.items.length ? quiz.items[quiz.items.length - 1] : null;
  if (prev && pool.length > 1) { const other = pool.filter((p) => p.t.id !== prev.topic.id || topicIds.length === 1); const notSame = other.filter((p) => p.fn !== prev.fn); pool = notSame.length ? notSame : other.length ? other : pool; }
  const p = pick(pool);
  return { topic: p.t, fn: p.fn, q: p.fn() };
}

function startQuiz(topicIds, title) {
  quiz = { topicIds, title, items: [], index: 0, score: 0 };
  nextQuestion();
}
function nextQuestion() {
  if (quiz.items.length >= QUIZ_LEN) return showResults();
  quiz.items.push({ ...makeQuestion(quiz.topicIds), answered: false, correct: false, given: null });
  renderQuestion();
}
const norm = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '');
function answer(given) {
  const item = quiz.items[quiz.items.length - 1]; if (item.answered) return;
  const ok = item.q.kind === 'typed' ? item.q.accept.some((a) => norm(a) === norm(given)) : norm(given) === norm(item.q.answer);
  item.answered = true; item.correct = ok; item.given = given;
  if (ok) quiz.score++;
  const s = (stats[item.topic.id] ||= { right: 0, total: 0 }); s.total++; if (ok) s.right++; store.set('stats', stats);
  renderQuestion();
}

// ---------- screens ----------
const app = document.getElementById('app');
function bestBadge(id) {
  const s = stats[id]; if (!s || !s.total) return '<span class="best">Not tried</span>';
  const pct = Math.round((100 * s.right) / s.total);
  return `<span class="best ${pct >= 75 ? 'good' : pct < 50 ? 'weak' : ''}">${pct}% right</span>`;
}
function weakTopics() {
  return TOPICS.filter((t) => { const s = stats[t.id]; return s && s.total >= 3 && s.right / s.total < 0.7; }).map((t) => t.id);
}

function renderHome() {
  quiz = null;
  const weak = weakTopics();
  app.innerHTML = `
    <header class="top">
      <h1>Charlie's <span class="hl">English</span></h1>
      <div class="levels" role="group" aria-label="Level">${LEVELS.map((l) => `<button data-level="${l.id}" aria-pressed="${l.id === level}">${l.name}</button>`).join('')}</div>
    </header>
    <section class="hero">
      <h2>Quick test</h2>
      <p class="muted">${QUIZ_LEN} mixed questions from this term's grammar, vocabulary and reading. After each one you see the right answer and a tip.</p>
      <div class="actions">
        <button class="btn" id="quick">Start quick test</button>
        ${weak.length ? `<button class="btn ghost" id="weak">Practise my tricky topics (${weak.length})</button>` : ''}
      </div>
    </section>
    <h2>Topics</h2>
    <div class="topics">${TOPICS.map((t) => `
      <div class="topic">
        <div class="row"><h3>${t.name}</h3>${bestBadge(t.id)}</div>
        <p class="muted">${t.blurb}</p>
        <div class="row"><button data-learn="${t.id}">Learn</button><button class="go" data-practise="${t.id}">Practise</button></div>
      </div>`).join('')}</div>`;
  app.querySelectorAll('[data-level]').forEach((b) => b.addEventListener('click', () => { level = b.dataset.level; store.set('level', level); renderHome(); }));
  document.getElementById('quick').addEventListener('click', () => startQuiz(TOPICS.map((t) => t.id), 'Quick test'));
  const w = document.getElementById('weak'); if (w) w.addEventListener('click', () => startQuiz(weak, 'Tricky topics'));
  app.querySelectorAll('[data-learn]').forEach((b) => b.addEventListener('click', () => renderLesson(TOPICS.find((t) => t.id === b.dataset.learn))));
  app.querySelectorAll('[data-practise]').forEach((b) => b.addEventListener('click', () => { const t = TOPICS.find((x) => x.id === b.dataset.practise); startQuiz([t.id], t.name); }));
  window.scrollTo(0, 0);
}

function renderLesson(t) {
  quiz = null;
  app.innerHTML = `
    <div><button class="btn ghost" id="home">← Home</button></div>
    <section class="card lesson">
      <span class="tag">Learn</span>
      <h2>${t.name}</h2>
      ${t.lesson}
    </section>
    <button class="btn wide" id="go">Practise ${t.name.toLowerCase()}</button>`;
  document.getElementById('home').addEventListener('click', renderHome);
  document.getElementById('go').addEventListener('click', () => startQuiz([t.id], t.name));
  window.scrollTo(0, 0);
}

function renderQuestion() {
  const item = quiz.items[quiz.items.length - 1]; const q = item.q; const n = quiz.items.length;
  const long = q.text.length > 80;
  let body;
  if (q.kind === 'choice') {
    const longChoices = q.choices.some((c) => c.length > 22);
    body = `<div class="choices ${longChoices ? 'long' : ''}">${q.choices.map((c, i) => {
      let cls = ''; if (item.answered) { if (norm(c) === norm(q.answer)) cls = 'right'; else if (c === item.given) cls = 'wrong'; }
      return `<button class="choice ${cls}" data-c="${esc(c)}" ${item.answered ? 'disabled' : ''}><span class="n">${i + 1}</span><span>${esc(c)}</span></button>`;
    }).join('')}</div>`;
  } else {
    body = `<form class="typed" id="tf"><input id="ti" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer" value="${item.answered ? esc(item.given) : ''}" ${item.answered ? 'disabled' : ''}>${item.answered ? '' : '<button class="btn" type="submit">Check</button>'}</form>`;
  }
  let fb = '';
  if (item.answered) {
    fb = item.correct
      ? `<div class="feedback good"><strong>Correct!</strong><span>${esc(item.topic.tip)}</span></div>`
      : `<div class="feedback bad"><strong>Not quite.</strong><span>The answer is <b>${esc(q.kind === 'typed' ? q.accept.join(' or ') : q.answer)}</b>.</span><span>${esc(item.topic.tip)}</span></div>`;
  }
  app.innerHTML = `
    <div class="qmeta"><button class="btn ghost" id="home" style="font-size:15px;padding:8px 14px">✕ Stop</button><span>${esc(quiz.title)}</span><span>Question ${n} of ${QUIZ_LEN} · ${quiz.score} right</span></div>
    <div class="bar"><div style="width:${((n - (item.answered ? 0 : 1)) / QUIZ_LEN) * 100}%"></div></div>
    <section class="card">
      <span class="tag">${esc(item.topic.name)}</span>
      <p class="qtext ${long ? 'long' : ''}">${esc(q.text)}</p>
      ${q.hint && !item.answered ? `<p class="hint">Hint: ${esc(q.hint)}</p>` : ''}
      ${body}
      ${fb}
      ${item.answered ? `<button class="btn wide" id="next">${n >= QUIZ_LEN ? 'See my score' : 'Next question'} →</button>` : ''}
    </section>`;
  document.getElementById('home').addEventListener('click', renderHome);
  app.querySelectorAll('.choice').forEach((b) => b.addEventListener('click', () => answer(b.dataset.c)));
  const tf = document.getElementById('tf');
  if (tf && !item.answered) { tf.addEventListener('submit', (e) => { e.preventDefault(); const v = document.getElementById('ti').value.trim(); if (v) answer(v); }); document.getElementById('ti').focus(); }
  const next = document.getElementById('next'); if (next) { next.addEventListener('click', nextQuestion); next.focus({ preventScroll: true }); }
}

function showResults() {
  const s = quiz.score; const pc = s / QUIZ_LEN; const stars = pc >= 0.9 ? 3 : pc >= 0.7 ? 2 : pc >= 0.4 ? 1 : 0;
  const msg = s === QUIZ_LEN ? 'Perfect score! Brilliant work.' : pc >= 0.7 ? 'Great work! Check the ones you missed below.' : pc >= 0.4 ? 'Good effort. Have a look at the tips and try again.' : 'Keep going! Read the Learn page, then have another go.';
  const by = {};
  for (const it of quiz.items) { const b = (by[it.topic.id] ||= { t: it.topic, right: 0, total: 0 }); b.total++; if (it.correct) b.right++; }
  const missed = quiz.items.filter((it) => !it.correct);
  const ids = quiz.topicIds; const title = quiz.title;
  const missedIds = [...new Set(missed.map((it) => it.topic.id))];
  app.innerHTML = `
    <section class="card" style="text-align:center;justify-items:center">
      <span class="tag">${esc(title)}</span>
      <div class="score">${s}/${QUIZ_LEN}</div>
      <div class="stars" aria-label="${stars} stars">${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>
      <p>${msg}</p>
    </section>
    <section class="card send">
      <h3>Send my score to Dad</h3>
      <div class="actions">
        <button class="btn" id="share">Send score</button>
        <a class="btn ghost" id="wa" target="_blank" rel="noopener">WhatsApp</a>
        <a class="btn ghost" id="mail">Email</a>
        <button class="btn ghost" id="copy">Copy</button>
      </div>
      <p class="muted" id="sent" hidden></p>
    </section>
    <section class="card">
      <h3>How you did</h3>
      <div class="results">${Object.values(by).map((b) => `<div class="r"><span>${esc(b.t.name)}</span><span>${b.right} of ${b.total}</span></div>`).join('')}</div>
    </section>
    ${missed.length ? `<section class="card"><h3>Questions to look at again</h3><div class="review">${missed.map((it) => `<div class="item"><b>${esc(it.q.text)}</b>You said: ${esc(it.given)} · Answer: <b style="display:inline">${esc(it.q.kind === 'typed' ? it.q.accept.join(' or ') : it.q.answer)}</b></div>`).join('')}</div></section>` : ''}
    <div class="actions">
      ${missedIds.length ? '<button class="btn" id="redo">Practise what I missed</button>' : ''}
      <button class="btn ${missedIds.length ? 'ghost' : ''}" id="again">Another test</button>
      <button class="btn ghost" id="home">Home</button>
    </div>`;
  document.getElementById('home').addEventListener('click', renderHome);
  document.getElementById('again').addEventListener('click', () => startQuiz(ids, title));
  const lvName = (LEVELS.find((l) => l.id === level) || LEVELS[1]).name;
  const when = new Date().toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  const report = `Charlie's English: ${title} (${lvName})\nScore: ${s}/${QUIZ_LEN} ${'★'.repeat(stars)}\n${when}\n\n` +
    Object.values(by).map((b) => `${b.right === b.total ? '✅' : '❌'} ${b.t.name}: ${b.right}/${b.total}`).join('\n');
  const sent = document.getElementById('sent');
  const done = (m) => { sent.textContent = m; sent.hidden = false; };
  document.getElementById('wa').href = 'https://wa.me/?text=' + encodeURIComponent(report);
  document.getElementById('mail').href = 'mailto:?subject=' + encodeURIComponent(`Charlie's English score: ${s}/${QUIZ_LEN}`) + '&body=' + encodeURIComponent(report);
  const copy = () => navigator.clipboard.writeText(report).then(() => done('Copied! Paste it into a message to Dad.'), () => done(report));
  document.getElementById('copy').addEventListener('click', copy);
  const shareBtn = document.getElementById('share');
  if (navigator.share) shareBtn.addEventListener('click', () => navigator.share({ title: "Charlie's English score", text: report }).catch(() => {}));
  else shareBtn.hidden = true;
  const redo = document.getElementById('redo'); if (redo) redo.addEventListener('click', () => startQuiz(missedIds, 'What I missed'));
  window.scrollTo(0, 0);
}

// keys 1-4 pick an answer, Enter goes on
document.addEventListener('keydown', (e) => {
  if (!quiz || !quiz.items.length || e.target.tagName === 'INPUT') return;
  const item = quiz.items[quiz.items.length - 1];
  if (!item.answered && item.q.kind === 'choice' && /^[1-4]$/.test(e.key)) answer(item.q.choices[+e.key - 1]);
});

renderHome();
</script>
</body>
</html>
