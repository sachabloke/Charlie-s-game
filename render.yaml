# Render reads this file and sets everything up, including the database that keeps the learning results.
databases:
  - name: learning-results
    plan: free
    databaseName: learning
    user: learning

services:
  - type: web
    name: maths-royale
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: learning-results
          property: connectionString
      - key: CHILDREN
        value: Charlie,Leo
