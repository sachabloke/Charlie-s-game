services:
  - type: web
    name: maths-royale
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL # free database link (see "Keeping results for good" in the README)
        sync: false
      - key: CHILDREN
        value: Charlie,Leo
